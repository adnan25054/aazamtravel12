<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041224" />
      <stop offset="50%" stop-color="#07192F" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="ogCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#07192F" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Luxury Navy Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- World Grid Background Pattern -->
  <g stroke="#38BDF8" stroke-width="1" stroke-opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Accent Orange & Green Glow Blobs -->
  <circle cx="200" cy="200" r="280" fill="#EA580C" opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="300" fill="#16A34A" opacity="0.10" filter="blur(60px)" />

  <!-- Outer Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="32" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Left Side: Official Brand Emblem (Large 280x280) -->
  <g transform="translate(100, 110)" filter="url(#ogShadow)">
    <rect x="0" y="0" width="280" height="280" rx="64" fill="#07192F" stroke="#F59E0B" stroke-width="5" />
    <rect x="10" y="10" width="260" height="260" rx="54" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Globe -->
    <g transform="translate(75, 45)">
      <circle cx="65" cy="65" r="58" fill="#0284C7" stroke="#BAE6FD" stroke-width="2" />
      <path d="M 30 30 Q 50 25 60 40 Q 70 50 60 65 Q 45 60 35 50 Z" fill="#4ADE80" />
      <path d="M 65 25 Q 90 20 100 35 Q 95 55 80 50 Z" fill="#4ADE80" />
      <path d="M 55 60 Q 80 55 90 75 Q 85 105 60 110 Q 50 95 55 75 Z" fill="#4ADE80" />
      <ellipse cx="65" cy="65" rx="58" ry="20" fill="none" stroke="#BAE6FD" stroke-width="1.5" opacity="0.6" />
      <path d="M 135 20 C 125 5 100 -10 65 -12 C 15 -15 -20 30 -10 85" fill="none" stroke="#FCD34D" stroke-width="4.5" stroke-linecap="round" />
      <polygon points="-10,85 -18,72 -2,76" fill="#FCD34D" />
    </g>

    <!-- Airplane -->
    <g transform="translate(205, 50) rotate(22)">
      <path d="M 0 12 C 15 8 40 6 50 11 C 45 16 20 18 0 12 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="1" />
      <path d="M 22 9 L 10 -16 L 18 -16 L 32 9 Z" fill="#DC2626" />
      <path d="M 24 13 L 15 34 L 22 34 L 33 13 Z" fill="#B91C1C" />
    </g>

    <!-- Bullet Train -->
    <g transform="translate(25, 175)">
      <path d="M 15 48 C 22 36 40 28 80 26 L 160 26 L 160 62 L 40 62 C 25 62 15 55 15 48 Z" fill="#16A34A" stroke="#DCFCE7" stroke-width="1.5" />
      <path d="M 25 46 C 45 38 80 37 160 37 L 160 42 C 80 42 45 43 25 50 Z" fill="#DC2626" />
      <rect x="75" y="32" width="12" height="8" rx="2" fill="#38BDF8" />
      <rect x="92" y="32" width="12" height="8" rx="2" fill="#38BDF8" />
      <rect x="109" y="32" width="12" height="8" rx="2" fill="#38BDF8" />
      <rect x="126" y="32" width="12" height="8" rx="2" fill="#38BDF8" />
      <ellipse cx="20" cy="48" rx="3.5" ry="4.5" fill="#FEF08A" />
    </g>

    <!-- Tour Bus -->
    <g transform="translate(155, 180)">
      <rect x="0" y="0" width="80" height="34" rx="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1" />
      <rect x="6" y="5" width="14" height="12" rx="2" fill="#38BDF8" />
      <rect x="23" y="5" width="12" height="12" rx="2" fill="#38BDF8" />
      <rect x="38" y="5" width="12" height="12" rx="2" fill="#38BDF8" />
      <rect x="53" y="5" width="12" height="12" rx="2" fill="#38BDF8" />
      <circle cx="18" cy="32" r="6" fill="#0F172A" />
      <circle cx="62" cy="32" r="6" fill="#0F172A" />
    </g>

    <!-- Golden Emblem Ribbon -->
    <rect x="20" y="238" width="240" height="34" rx="8" fill="url(#ogGold)" />
    <text x="140" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#07192F" text-anchor="middle" letter-spacing="1">
      AAZAM TRAVEL AGENCY
    </text>
  </g>

  <!-- Right Side: Official Brand Typography & Service Pitch -->
  <g transform="translate(430, 110)">
    <!-- Location & Certification Kicker -->
    <g transform="translate(0, 30)">
      <rect x="0" y="-20" width="220" height="32" rx="8" fill="#166534" />
      <text x="110" y="1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        ✓ VERIFIED TRAVEL DESK
      </text>
      
      <text x="240" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#F59E0B" letter-spacing="1.5">
        AKOLA, MAHARASHTRA
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="115" font-family="'Cabinet Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Aazam Travel Agency
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="165" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="600" fill="#94A3B8">
      Your Trusted Partner for Train, Flight &amp; Holiday Tours
    </text>

    <!-- Service Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: Train Tickets -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="46" rx="12" fill="#0F2C59" stroke="#38BDF8" stroke-width="1.5" />
        <text x="97" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
          🚆 IRCTC Train Tickets
        </text>
      </g>

      <!-- Pill 2: Flight Tickets -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="180" height="46" rx="12" fill="#0F2C59" stroke="#38BDF8" stroke-width="1.5" />
        <text x="90" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
          ✈️ Air Tickets / Best Fare
        </text>
      </g>

      <!-- Pill 3: Bus Booking -->
      <g transform="translate(405, 0)">
        <rect x="0" y="0" width="165" height="46" rx="12" fill="#0F2C59" stroke="#38BDF8" stroke-width="1.5" />
        <text x="82" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
          🚌 Bus Reservations
        </text>
      </g>
    </g>

    <!-- Second Row Pills: Tour Packages & Hotels -->
    <g transform="translate(0, 275)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="46" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1.5" />
        <text x="140" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
          🕌 Umrah &amp; Religious Packages
        </text>
      </g>
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="275" height="46" rx="12" fill="#7C2D12" stroke="#FB923C" stroke-width="1.5" />
        <text x="137" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
          🌴 Kashmir, Goa &amp; Holiday Tours
        </text>
      </g>
    </g>

    <!-- Contact & Call to Action Footer inside Image -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="680" height="58" rx="14" fill="#041224" stroke="#F59E0B" stroke-width="1.5" />
      <text x="25" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#FCD34D">
        📞 +91 94215 56220
      </text>
      <text x="240" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#38BDF8">
        💬 WhatsApp Desk
      </text>
      <text x="420" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#CBD5E1">
        📍 Station Rd, Akola (MH)
      </text>
    </g>
  </g>
</svg>
