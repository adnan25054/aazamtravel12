<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Badge Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192F" />
      <stop offset="50%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#0A3831" />
    </linearGradient>

    <!-- Globe Ocean Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Train Body Gradient -->
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Bus Gradient -->
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Airplane Gradient -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Gold Plaque & Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- 1. BASE CONTAINER (Rounded Luxury Shield Badge) -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="5.5" stroke-opacity="0.95" filter="url(#shadowFilter)" />

  <!-- Inner Decorative Dashed Border -->
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- 2. GLOBE (Centered Upper Hemisphere) -->
  <g transform="translate(146, 66)" filter="url(#shadowFilter)">
    <!-- Flight Orbit Behind Globe -->
    <path d="M -20 130 C -50 40 20 -30 110 -30 C 160 -30 200 -5 225 30" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="10 6" opacity="0.9" />

    <!-- Globe Sphere -->
    <circle cx="110" cy="110" r="95" fill="url(#globeGrad)" stroke="#BAE6FD" stroke-width="3" />

    <!-- Continents -->
    <g fill="#4ADE80" opacity="0.95">
      <!-- North America / Europe -->
      <path d="M 50 50 Q 80 40 95 60 Q 110 75 95 100 Q 75 95 60 80 Z" />
      <path d="M 110 40 Q 145 35 165 55 Q 160 80 135 75 Q 120 60 110 40 Z" />
      <!-- Africa / South Asia -->
      <path d="M 95 100 Q 135 95 155 120 Q 150 160 110 170 Q 90 150 95 115 Z" />
      <path d="M 160 105 Q 185 100 190 125 Q 175 150 160 135 Z" />
    </g>

    <!-- Grid Lines (Lat / Long) -->
    <path d="M 110 15 C 55 15 55 205 110 205 C 165 205 165 15 110 15" fill="none" stroke="#BAE6FD" stroke-width="2" opacity="0.5" />
    <ellipse cx="110" cy="110" rx="95" ry="32" fill="none" stroke="#BAE6FD" stroke-width="2" opacity="0.5" />

    <!-- Flight Orbit in Front of Globe -->
    <path d="M 225 30 C 210 10 180 -15 125 -20 C 45 -25 -25 50 -10 135" fill="none" stroke="#FCD34D" stroke-width="6.5" stroke-linecap="round" />
    <polygon points="-10,135 -24,115 -2,120" fill="#FCD34D" />
  </g>

  <!-- 3. AIRPLANE (Banking dynamically over globe) -->
  <g transform="translate(365, 82) rotate(22)" filter="url(#shadowFilter)">
    <path d="M 0 20 C 25 12 65 10 80 18 C 70 25 30 30 0 20 Z" fill="url(#planeGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 35 15 L 18 -26 L 30 -26 L 50 15 Z" fill="#DC2626" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 38 22 L 24 54 L 35 54 L 52 22 Z" fill="#B91C1C" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 4 16 L -10 -2 L -2 -2 L 10 16 Z" fill="#EF4444" />
    <path d="M 70 16 Q 76 18 72 21 Z" fill="#FFFFFF" />
  </g>

  <!-- 4. HOTEL & RESORT ARCHITECTURE (Midground) -->
  <g transform="translate(325, 224)">
    <rect x="0" y="0" width="48" height="95" rx="3" fill="#0D9488" stroke="#14B8A6" stroke-width="2" />
    <g fill="#FEF08A" opacity="0.95">
      <rect x="8" y="10" width="8" height="10" rx="1.5" />
      <rect x="22" y="10" width="8" height="10" rx="1.5" />
      <rect x="8" y="28" width="8" height="10" rx="1.5" />
      <rect x="22" y="28" width="8" height="10" rx="1.5" />
      <rect x="8" y="46" width="8" height="10" rx="1.5" />
      <rect x="22" y="46" width="8" height="10" rx="1.5" />
      <rect x="8" y="64" width="8" height="10" rx="1.5" />
      <rect x="22" y="64" width="8" height="10" rx="1.5" />
    </g>
    <rect x="7" y="-14" width="34" height="13" rx="2" fill="#B91C1C" />
    <text x="24" y="-5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HOTEL</text>
  </g>

  <!-- 5. RED LUXURY TOUR BUS -->
  <g transform="translate(258, 282)">
    <rect x="0" y="0" width="130" height="56" rx="8" fill="url(#busGrad)" stroke="#FEE2E2" stroke-width="1.8" filter="url(#shadowFilter)" />
    <path d="M 8 0 L 122 0 Q 130 0 130 8 L 130 14 L 0 14 L 0 8 Q 0 0 8 0 Z" fill="#FFFFFF" opacity="0.3" />
    <g fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5">
      <rect x="8" y="9" width="22" height="20" rx="3" />
      <rect x="34" y="9" width="19" height="20" rx="3" />
      <rect x="57" y="9" width="19" height="20" rx="3" />
      <rect x="80" y="9" width="19" height="20" rx="3" />
      <rect x="103" y="9" width="18" height="20" rx="3" />
    </g>
    <line x1="2" y1="35" x2="128" y2="35" stroke="#FCD34D" stroke-width="2.5" />
    <circle cx="124" cy="42" r="4.5" fill="#FEF08A" />
    <g transform="translate(30, 52)">
      <circle cx="0" cy="0" r="11" fill="#0F172A" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="0" cy="0" r="4.5" fill="#94A3B8" />
    </g>
    <g transform="translate(100, 52)">
      <circle cx="0" cy="0" r="11" fill="#0F172A" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="0" cy="0" r="4.5" fill="#94A3B8" />
    </g>
  </g>

  <!-- 6. HIGH-SPEED BULLET TRAIN (Foreground Focal Element) -->
  <g transform="translate(46, 274)" filter="url(#shadowFilter)">
    <line x1="0" y1="65" x2="60" y2="65" stroke="#FCD34D" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="15" y1="78" x2="75" y2="78" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="5" y1="92" x2="85" y2="92" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <path d="M 25 78 C 35 60 65 46 125 44 L 255 44 L 255 102 L 65 102 C 40 102 25 90 25 78 Z" fill="url(#trainGrad)" stroke="#DCFCE7" stroke-width="2.5" />
    <path d="M 25 78 C 45 64 80 52 160 50" fill="none" stroke="#BBF7D0" stroke-width="4" stroke-linecap="round" />
    <path d="M 40 76 C 75 64 130 62 255 62 L 255 69 C 130 69 75 71 40 82 Z" fill="#EF4444" />
    <path d="M 48 66 C 62 52 90 48 100 48 L 108 48 C 90 62 76 72 62 76 Z" fill="#0F172A" stroke="#4ADE80" stroke-width="1.8" />
    <path d="M 54 64 C 65 54 86 51 95 51 L 96 52 C 82 62 70 70 62 73 Z" fill="#38BDF8" opacity="0.9" />

    <g fill="#0F172A" stroke="#86EFAC" stroke-width="1.2">
      <rect x="120" y="52" width="20" height="13" rx="3" />
      <rect x="148" y="52" width="20" height="13" rx="3" />
      <rect x="176" y="52" width="20" height="13" rx="3" />
      <rect x="204" y="52" width="20" height="13" rx="3" />
      <rect x="232" y="52" width="18" height="13" rx="3" />
    </g>
    <g fill="#38BDF8" opacity="0.85">
      <rect x="123" y="54" width="14" height="8" rx="1.5" />
      <rect x="151" y="54" width="14" height="8" rx="1.5" />
      <rect x="179" y="54" width="14" height="8" rx="1.5" />
      <rect x="207" y="54" width="14" height="8" rx="1.5" />
      <rect x="235" y="54" width="12" height="8" rx="1.5" />
    </g>
    <ellipse cx="32" cy="78" rx="5" ry="7" fill="#FEF08A" stroke="#FFFFFF" stroke-width="1" />
    <rect x="58" y="100" width="195" height="7" fill="#0F172A" />
    <circle cx="95" cy="108" r="6" fill="#475569" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="125" cy="108" r="6" fill="#475569" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="195" cy="108" r="6" fill="#475569" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="225" cy="108" r="6" fill="#475569" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <!-- 7. COMPASS STAR (Top Left) -->
  <g transform="translate(68, 68)">
    <polygon points="20,0 25,14 39,20 25,25 20,39 15,25 1,20 15,14" fill="#FCD34D" filter="url(#shadowFilter)" />
    <circle cx="20" cy="20" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- 8. OFFICIAL OLD LOGO BRAND PLAQUE -->
  <g transform="translate(46, 392)" filter="url(#shadowFilter)">
    <rect x="0" y="0" width="420" height="76" rx="20" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <rect x="4" y="4" width="412" height="68" rx="16" fill="none" stroke="#78350F" stroke-width="1" stroke-opacity="0.35" />

    <polygon points="32,28 34,34 40,34 35,38 37,44 32,40 27,44 29,38 24,34 30,34" fill="#78350F" opacity="0.6" />
    <polygon points="388,28 390,34 396,34 391,38 393,44 388,40 383,44 385,38 380,34 386,34" fill="#78350F" opacity="0.6" />

    <text x="210" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#07192F" text-anchor="middle" letter-spacing="1.8">
      AAZAM TRAVEL AGENCY
    </text>
    <text x="210" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#78350F" text-anchor="middle" letter-spacing="2.8">
      AKOLA • MAHARASHTRA
    </text>
  </g>
</svg>
